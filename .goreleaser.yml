version: 2

project_name: prism

before:
  hooks:
    - go mod tidy

builds:
  - id: prism
    main: ./cmd/prism
    binary: prism
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: prism
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: nowgnas
    name: prism

brews:
  - name: prism
    repository:
      owner: nowgnas
      name: homebrew-tap
    homepage: https://github.com/nowgnas/prism
    description: "A colorful TUI terminal multiplexer with tab-per-project panes"
    license: MIT
    test: |
      system "#{bin}/prism --version"
    install: |
      bin.install "prism"
